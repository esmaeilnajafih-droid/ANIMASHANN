<div class="header">
    <div class="header-content">
        <div class="header-badge"><i class="fas fa-crown"></i> برترین انیمیشن‌ها</div>
        <h1><i class="fas fa-film"></i> سینمای انیمیشن</h1>
        <p class="subtitle"><i class="fas fa-play-circle"></i> بیش از {{ total_count }} انیمیشن دوبله فارسی از آپارات</p>
        {% include 'stats.html' %}
    </div>
</div>
<style>
.header {
    text-align:center;
    padding:70px 30px 50px;
    background:var(--glass-main);
    backdrop-filter:blur(40px);
    border-radius:var(--radius-main);
    margin-bottom:35px;
    border:1px solid var(--glass-border);
    box-shadow:var(--shadow-main);
    position:relative;
    overflow:hidden;
}
.header::before {
    content:'';
    position:absolute;
    inset:-2px;
    background:conic-gradient(from 0deg, transparent, rgba(255,107,107,0.4), rgba(78,205,196,0.4), transparent);
    border-radius:var(--radius-main);
    z-index:-1;
    animation:rotateBorder 8s linear infinite;
    filter:blur(30px);
}
@keyframes rotateBorder {
    0% { transform:rotate(0deg); }
    100% { transform:rotate(360deg); }
}
.header-content { position:relative; z-index:1; }
.header-badge {
    display:inline-block;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    padding:8px 24px;
    border-radius:50px;
    font-size:0.85rem;
    color:var(--accent-2);
    border:1px solid rgba(78,205,196,0.25);
    margin-bottom:20px;
    letter-spacing:3px;
    animation:badgePulse 2s infinite;
}
@keyframes badgePulse {
    0%,100% { box-shadow:0 0 20px rgba(78,205,196,0); }
    50% { box-shadow:0 0 60px rgba(78,205,196,0.15); }
}
.header h1 {
    font-size:5rem;
    font-weight:900;
    background:var(--gradient-main);
    background-size:300% 300%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:gradientMove 5s ease-in-out infinite;
    letter-spacing:5px;
}
@keyframes gradientMove {
    0% { background-position:0% 50%; }
    50% { background-position:100% 50%; }
    100% { background-position:0% 50%; }
}
.header h1 i {
    -webkit-text-fill-color:initial;
    color:#fff;
    margin-left:25px;
    filter:drop-shadow(0 0 40px rgba(108,92,231,0.5));
    animation:iconFloat 4s ease-in-out infinite;
}
@keyframes iconFloat {
    0%,100% { transform:translateY(0); }
    50% { transform:translateY(-15px); }
}
.header .subtitle {
    font-size:1.4rem;
    color:var(--text-secondary);
    margin-top:15px;
    font-weight:300;
}
.header .subtitle i {
    color:var(--accent-2);
    margin-left:12px;
}
@media (max-width:768px) {
    .header h1 { font-size:3rem; }
    .header { padding:40px 20px 30px; }
    .header .subtitle { font-size:1rem; }
}
@media (max-width:480px) {
    .header h1 { font-size:2rem; }
    .header { padding:25px 15px 20px; }
}
</style>
